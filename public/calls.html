<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call Logs — VoiceAgent</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">V</div>
      <div><div class="logo-text">VoiceAgent</div><div class="logo-sub">Dashboard</div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Main</div>
      <a class="nav-item" href="/dashboard" data-page="dashboard"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></a>
      <a class="nav-item" href="/calls" data-page="calls"><span class="nav-icon">📞</span><span class="nav-label">Call Logs</span></a>
      <a class="nav-item" href="/live" data-page="live"><span class="nav-icon">🔴</span><span class="nav-label">Live Calls</span><span class="nav-badge green" id="live-badge" style="display:none">0</span></a>
      <a class="nav-item" href="/appointments" data-page="appointments"><span class="nav-icon">📅</span><span class="nav-label">Appointments</span></a>
      <a class="nav-item" href="/leads" data-page="leads"><span class="nav-icon">👥</span><span class="nav-label">Leads</span></a>
      <a class="nav-item" href="/costs" data-page="costs"><span class="nav-icon">💰</span><span class="nav-label">Cost Tracker</span></a>
      <div class="nav-section">Account</div>
      <a class="nav-item" href="/settings" data-page="settings"><span class="nav-icon">🔑</span><span class="nav-label">Settings</span></a>
      <div class="nav-section" data-admin-only>Admin</div>
      <a class="nav-item" href="/clients" data-page="clients" data-admin-only><span class="nav-icon">⚙️</span><span class="nav-label">Clients</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="sidebar-user-avatar">A</div>
        <div><div class="user-name" id="sidebar-user-name">Loading...</div><div class="user-role" id="sidebar-user-role"></div></div>
      </div>
      <button id="logout-btn" class="btn btn-ghost btn-sm" style="width:100%;justify-content:center;margin-top:10px">🚪 Logout</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <div class="page-title">Call Logs</div>
        <div class="page-sub">All inbound and outbound call records</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-secondary btn-sm" id="sync-btn">↺ Sync Now</button>
        <button class="btn btn-secondary btn-sm" id="export-btn">⬇ Export CSV</button>
      </div>
    </div>

    <div class="page-body">
      <!-- Filters -->
      <div class="filter-bar">
        <select id="filter-type">
          <option value="">All Types</option>
          <option value="inbound">Inbound</option>
          <option value="outbound">Outbound</option>
        </select>
        <select id="filter-status">
          <option value="">All Statuses</option>
          <option value="ended">Ended</option>
          <option value="ongoing">Ongoing</option>
          <option value="error">Error</option>
        </select>
        <input type="date" id="filter-from" placeholder="From date">
        <input type="date" id="filter-to" placeholder="To date">
        <input type="text" id="filter-search" placeholder="Search phone number..." style="min-width:200px">
      </div>

      <!-- Table -->
      <div class="card">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>#</th><th>Type</th><th>From</th><th>To</th><th>Agent</th>
                <th>Duration</th><th>Status</th><th>Outcome</th><th>Cost</th><th>Date</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="calls-tbody">
              <tr><td colspan="11" style="text-align:center;padding:40px;color:var(--text-muted)">Loading calls...</td></tr>
            </tbody>
          </table>
        </div>
        <div id="pagination" class="pagination"></div>
      </div>
    </div>
  </main>
</div>

<!-- Transcript Modal -->
<div class="modal-overlay" id="transcript-modal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title">Call Transcript</div>
      <button class="modal-close">&times;</button>
    </div>
    <div class="modal-body">
      <div class="summary-box" id="modal-summary"></div>
      <div class="transcript-text" id="modal-transcript"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="copy-transcript">📋 Copy</button>
      <button class="btn btn-secondary modal-close">Close</button>
    </div>
  </div>
</div>

<!-- Outcome Modal -->
<div class="modal-overlay" id="outcome-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Set Call Outcome</div>
      <button class="modal-close">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="outcome-call-id">
      <div class="form-group">
        <label class="form-label">Outcome</label>
        <select id="outcome-select" class="form-control">
          <option value="">— No outcome —</option>
          <option value="qualified">Qualified</option>
          <option value="not_interested">Not Interested</option>
          <option value="callback">Callback</option>
          <option value="no_answer">No Answer</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary modal-close">Cancel</button>
      <button class="btn btn-primary" id="save-outcome">Save</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/calls.js"></script>
</body>
</html>
