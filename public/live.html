<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Calls — VoiceAgent</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">V</div>
      <div><div class="logo-text">VoiceAgent</div><div class="logo-sub">Dashboard</div></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Main</div>
      <a class="nav-item" href="/dashboard" data-page="dashboard"><span class="nav-icon">📊</span><span class="nav-label">Dashboard</span></a>
      <a class="nav-item" href="/agents" data-page="agents" data-hide-readonly><span class="nav-icon">🤖</span><span class="nav-label">Agent Builder</span></a>
      <a class="nav-item" href="/calls" data-page="calls"><span class="nav-icon">📞</span><span class="nav-label">Call Logs</span></a>
      <a class="nav-item" href="/live" data-page="live"><span class="nav-icon">🔴</span><span class="nav-label">Live Calls</span><span class="nav-badge green" id="live-badge" style="display:none">0</span></a>
      <a class="nav-item" href="/appointments" data-page="appointments"><span class="nav-icon">📅</span><span class="nav-label">Appointments</span></a>
      <a class="nav-item" href="/insurance" data-page="insurance"><span class="nav-icon">🛡️</span><span class="nav-label">Insurance</span></a>
      <a class="nav-item" href="/analytics" data-page="analytics"><span class="nav-icon">📈</span><span class="nav-label">Analytics</span></a>
      <a class="nav-item" href="/leads" data-page="leads"><span class="nav-icon">👥</span><span class="nav-label">Leads</span></a>
      <a class="nav-item" href="/costs" data-page="costs" data-admin-only><span class="nav-icon">💰</span><span class="nav-label">Cost Tracker</span></a>
      <div class="nav-section">Account</div>
      <a class="nav-item" href="/settings" data-page="settings"><span class="nav-icon">🔑</span><span class="nav-label">Settings</span></a>
      <div class="nav-section" data-admin-only>Admin</div>
      <a class="nav-item" href="/clients" data-page="clients" data-admin-only><span class="nav-icon">⚙️</span><span class="nav-label">Clients</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="sidebar-user-avatar">A</div>
        <div><div class="user-name" id="sidebar-user-name">Loading...</div><div class="user-role" id="sidebar-user-role"></div></div>
      </div>
      <div id="readonly-badge" style="display:none;background:rgba(245,158,11,.15);color:#f59e0b;font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px;text-align:center;margin-bottom:8px">👁 Read-Only Mode</div>
      <button id="logout-btn" class="btn btn-ghost btn-sm" style="width:100%;justify-content:center;margin-top:10px">🚪 Logout</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <div class="page-title">Live Calls</div>
        <div class="page-sub">
          Real-time active call monitoring
          <span id="socket-status" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--text-dim);margin-left:8px;vertical-align:middle;transition:background 0.3s" title="Socket status"></span>
        </div>
      </div>
      <button class="btn btn-secondary btn-sm" id="refresh-btn">↺ Refresh</button>
    </div>

    <div class="page-body">
      <!-- Big Counter -->
      <div style="text-align:center;padding:32px 0 16px">
        <div class="live-count" id="live-count">0</div>
        <div class="live-count-label">Active Calls Right Now</div>
      </div>

      <!-- Call Cards -->
      <div class="live-calls-grid" id="live-calls-grid">
        <div class="empty-state" style="grid-column:1/-1">
          <div class="empty-icon">📵</div>
          <p>No active calls right now</p>
        </div>
      </div>
    </div>
  </main>
</div>

<style>
  #socket-status.connected { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
</style>

<script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/live.js"></script>
</body>
</html>
