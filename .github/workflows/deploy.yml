name: Deploy to VPS

on:
  push:
    branches:
      - main   # main branch pe push hone pe auto-deploy

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}       # Server IP
          username: ${{ secrets.VPS_USER }}   # SSH username (e.g. root or ubuntu)
          key: ${{ secrets.VPS_SSH_KEY }}     # SSH private key
          port: ${{ secrets.VPS_PORT || 22 }} # SSH port (default 22)
          script: |
            set -e

            APP_DIR="${{ secrets.DEPLOY_PATH }}"   # e.g. /var/www/retell-dashboard

            echo ">>> Pulling latest code..."
            cd "$APP_DIR"
            git pull origin main

            echo ">>> Installing dependencies..."
            npm install --omit=dev

            echo ">>> Restarting app with PM2..."
            pm2 restart retell-dashboard --update-env || pm2 start "node --experimental-sqlite server.js" --name retell-dashboard
            pm2 save

            echo ">>> Deploy complete!"
