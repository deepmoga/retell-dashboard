name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to calling.officialdigitalmarketing.in
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 62.84.184.96
          username: root
          password: ${{ secrets.ROOT }}
          port: 22
          script: |
            set -e
            cd /var/www/retell-dashboard

            echo ">>> Current PM2 processes:"
            pm2 list

            echo ">>> Pulling latest code..."
            git pull origin main

            echo ">>> Installing dependencies..."
            npm install --omit=dev

            echo ">>> Restarting all PM2 processes..."
            pm2 reload all --update-env
            pm2 save

            echo ">>> PM2 Status after restart:"
            pm2 list

            echo ">>> Deploy complete! Site: https://calling.officialdigitalmarketing.in"
