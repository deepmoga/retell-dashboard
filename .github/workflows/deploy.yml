name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to calling.officialdigitalmarketing.in
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 62.84.184.96
          username: root
          password: ${{ secrets.ROOT }}
          port: 22
          script: |
            set -e
            cd /var/www/retell-dashboard

            echo ">>> Pulling latest code..."
            git checkout -- package-lock.json || true
            git pull origin main

            echo ">>> Latest commits:"
            git log --oneline -3

            echo ">>> Checking agents route file exists:"
            ls -la routes/agents.js

            echo ">>> Checking server.js has agents route:"
            grep -n "agents" server.js

            echo ">>> Installing dependencies..."
            npm install --omit=dev

            echo ">>> Stopping old retell-dashboard process..."
            pm2 stop retell-dashboard || true
            pm2 delete retell-dashboard || true

            echo ">>> Starting fresh with correct node args..."
            pm2 start server.js --name retell-dashboard --node-args="--experimental-sqlite"
            sleep 3
            pm2 save

            echo ">>> PM2 Status:"
            pm2 list

            echo ">>> Cleaning test bookings from DB..."
            node -e "
              const { db } = require('./database/db');
              const deleted = db.prepare(\"DELETE FROM appointments WHERE customer_name = 'Test Ravish' OR notes LIKE '%test%'\").run();
              console.log('Deleted test records:', deleted.changes);
            " || true

            echo ">>> Testing API route locally:"
            curl -s -o /dev/null -w "GET /api/agents HTTP status: %{http_code}\n" http://localhost:3000/api/agents || echo "curl failed"

            echo ">>> Deploy complete! Site: https://calling.officialdigitalmarketing.in"
