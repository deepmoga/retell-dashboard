name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to calling.officialdigitalmarketing.in
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 62.84.184.96
          username: root
          password: ${{ secrets.ROOT }}
          port: 22
          script: |
            set -e
            cd /var/www/retell-dashboard

            echo ">>> Pulling latest code..."
            git pull origin main

            echo ">>> Latest commits:"
            git log --oneline -3

            echo ">>> Checking agents route file exists:"
            ls -la routes/agents.js

            echo ">>> Checking server.js has agents route:"
            grep -n "agents" server.js

            echo ">>> Installing dependencies..."
            npm install --omit=dev

            echo ">>> Stopping old retell-dashboard process..."
            pm2 stop retell-dashboard || true
            pm2 delete retell-dashboard || true

            echo ">>> Starting fresh with correct node args..."
            pm2 start server.js --name retell-dashboard --node-args="--experimental-sqlite" --wait-ready --listen-timeout 10000
            pm2 save

            echo ">>> PM2 Status:"
            pm2 list

            echo ">>> Deploy complete! Site: https://calling.officialdigitalmarketing.in"
