name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to calling.officialdigitalmarketing.in
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 62.84.184.96
          username: root
          password: ${{ secrets.ROOT }}
          port: 22
          script: |
            set -e
            cd /var/www/retell-dashboard

            echo ">>> Pulling latest code..."
            git pull origin main

            echo ">>> Installing dependencies..."
            npm install --omit=dev

            echo ">>> Restarting app..."
            pm2 restart retell-dashboard --update-env
            pm2 save

            echo ">>> Deploy complete! Site: https://calling.officialdigitalmarketing.in"
